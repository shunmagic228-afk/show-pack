<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fa"><title>SHOW PACK | 忘れ物リスト</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SHOW PACK"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#23333d;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid #e4e9ed;padding:17px max(18px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:850;letter-spacing:.08em;font-size:21px}.logo span{color:#168a82}.layout{max-width:1050px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:255px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:19px;box-shadow:0 5px 24px #1a334008}.side-title,.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:12px;color:#7c8993}.projects{display:grid;gap:7px;margin-top:14px}.project{border:0;background:transparent;text-align:left;border-radius:11px;padding:13px;color:inherit}.project.active{background:#e7f4f2;color:#08776e}.project small{display:block;color:#7d9295;margin-top:5px}.btn{border:1px solid #dce5e8;background:white;border-radius:10px;padding:9px 12px;color:#35515a}.primary{background:#12877e;border-color:#12877e;color:white;font-weight:700}.danger{color:#c54848}.actions{display:flex;gap:7px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0}.progress{height:7px;background:#e9eff1;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#168f85}.section{margin-top:23px}.items{margin-top:12px;border:1px solid #e8edf0;border-radius:12px;overflow:hidden}.item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #edf1f3}.item:last-child{border-bottom:0}.item:has([data-check]){cursor:pointer;min-height:49px;touch-action:manipulation}.item:has([data-check]):active{background:#e7f4f2}.item.important:active{background:#ffe7df}.item.important{background:#fff4f1}.item label.check-target{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;min-height:34px;touch-action:manipulation}.item label.check-target:active{opacity:.65}.item input{width:19px;height:19px;accent-color:#12877e;flex-shrink:0}.item.done .name{text-decoration:line-through;text-decoration-color:#89979d;text-decoration-thickness:1px;color:#62737c;font-weight:500}.item.done{background:#f7faf9}.item.done.important{background:#fff4f1}.name{flex:1;overflow-wrap:anywhere}.tag{color:#b53f36;font-size:11px;font-weight:750}.edit{border:0;background:transparent;color:#6c7b85;font-size:20px;padding:4px 8px}.entry{margin-top:12px;background:#f7f9fa;padding:13px;border-radius:12px}.entry textarea{width:100%;min-height:76px;resize:vertical;border:1px solid #dce4e8;border-radius:9px;padding:10px;background:white}.entry .between{margin-top:8px}.field{width:100%;padding:11px;border:1px solid #dce4e8;border-radius:9px}dialog{border:0;border-radius:17px;box-shadow:0 20px 90px #20313b35;padding:23px;width:min(430px,calc(100vw - 30px))}dialog::backdrop{background:#10252a70}dialog label{display:block;font-size:13px;margin:14px 0 6px}dialog menu{padding:0;margin:22px 0 0;display:flex;justify-content:flex-end;gap:8px}.footer{margin-top:25px;display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:12px;color:#7b8990;line-height:1.7}.hide{display:none}@media(max-width:700px){.layout{display:block;margin:12px auto}.panel{padding:16px}.sidebar{margin-bottom:12px}.projects{display:flex;overflow-x:auto}.project{flex:0 0 auto;min-width:145px}.actions{margin-top:14px}header{padding:15px 18px}.item{padding:11px 8px}.tag{font-size:10px}}
</style></head><body><header><div class="logo">SHOW <span>PACK</span></div><span class="muted">端末ごとに保存 · 同期なし</span></header><div class="layout"><aside class="panel sidebar"><div class="side-title"><b>案件一覧</b><button class="btn primary" id="new">＋ 新規</button></div><div id="projects" class="projects"></div><p class="hint">MacとiPhoneではデータが別々です。必要なら「書き出し／読み込み」で移せます。</p></aside><main class="panel" id="main"></main></div>
<dialog id="projectDialog"><form method="dialog" id="projectForm"><h2 id="projectHeading">新規案件</h2><label>案件名</label><input class="field" id="projectName" required maxlength="100"><label>最初の持ち物（任意・1行に1つ）</label><textarea class="field" id="initialItems" rows="7" placeholder="・私物関連&#10;移動着&#10;PC&#10;・マジック道具&#10;赤トランプ2組"></textarea><p class="hint">「・カテゴリー名」で分類できます。見出しがなければ「持ち物」に入ります。</p><menu><button class="btn" value="cancel">キャンセル</button><button class="btn primary" value="save">作成</button></menu></form></dialog>
<dialog id="editDialog"><form method="dialog" id="editForm"><h2>持ち物の編集</h2><label>名前</label><input class="field" id="editName" required><label>カテゴリー</label><select class="field" id="editGroup"></select><label><input type="checkbox" id="editImportant"> ★ 最重要アイテム</label><menu><button class="btn danger" type="button" id="removeItem">削除</button><button class="btn" value="cancel">閉じる</button><button class="btn primary" value="save">保存</button></menu></form></dialog>
<input type="file" id="importFile" accept="application/json,.json" class="hide"><script>
const KEY='showpack-projects-v2',CHECK='showpack-checks-v2',SEL='showpack-selected-v2';const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const seed=[{name:'私物関連',items:['移動着','青パーカー（ホテルでの動画撮影用）','移動靴','パンツ ×2枚','靴下 ×3足','白い肌着','オズポケセット','三脚１','三脚２','棒状ライト','PC','PC充電器','SSDポーチ']},{name:'現場入り',items:['スーツジャケット','スーツズボン','黒T','革靴','メイク道具','ワックス','スプレー']},{name:'マジック道具',items:['赤トランプ ×2組','バレニアカード','オレンジトランプ ×2組','オムニデック ×2組','デビルハンカチ','ケネディコイン','モルガンなど（動画撮影用）','ムーンボックス','エニシングボックス（予備）']}];const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fresh=()=>[{id:uid(),name:'HERMÈS 大阪',groups:seed.map(g=>({id:uid(),name:g.name,items:g.items.map(name=>({id:uid(),name,important:['ムーンボックス','バレニアカード'].includes(name)}))}))}];let projects;try{projects=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{projects=fresh()}let checks;try{checks=JSON.parse(localStorage.getItem(CHECK))||{}}catch{checks={}}let selected=localStorage.getItem(SEL)||projects[0]?.id;const current=()=>projects.find(p=>p.id===selected);function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}function saveChecks(){localStorage.setItem(CHECK,JSON.stringify(checks));render()}function parseBulk(raw,defaultName='持ち物'){let groups=[],group=null;for(const line of raw.split(/\r?\n/)){const s=line.trim();if(!s)continue;const m=s.match(/^[・●■#]\s*(.+)$/);if(m){group={name:m[1].trim(),items:[]};groups.push(group);continue}if(!group){group={name:defaultName,items:[]};groups.push(group)}group.items.push({id:uid(),name:s.replace(/^[\-•]\s*/,''),important:false})}return groups}function mergeBulk(p,raw,defaultGroup){let parsed=parseBulk(raw,defaultGroup.name);for(const group of parsed){let target=p.groups.find(g=>g.name===group.name);if(!target){target={id:uid(),name:group.name,items:[]};p.groups.push(target)}target.items.push(...group.items)}}function render(){if(!current()&&projects.length)selected=projects[0].id;localStorage.setItem(SEL,selected||'');$('projects').innerHTML=projects.map(p=>`<button class="project ${p.id===selected?'active':''}" data-project="${esc(p.id)}"><b>${esc(p.name)}</b><small>${p.groups.reduce((n,g)=>n+g.items.length,0)}項目</small></button>`).join('');const p=current();if(!p){$('main').innerHTML='<p>「＋ 新規」から案件を作成してください。</p>';return}const all=p.groups.flatMap(g=>g.items),done=all.filter(i=>checks[p.id+':'+i.id]).length;$('main').innerHTML=`<div class="between"><div><h1>${esc(p.name)}</h1><div class="muted">忘れ物チェックリスト</div></div></div><div class="actions" style="margin-top:15px"><button class="btn" data-action="rename">名前変更</button><button class="btn" data-action="duplicate">複製</button><button class="btn danger" data-action="delete">案件削除</button></div><div class="between" style="margin-top:24px"><b>準備状況</b><span class="muted">${done} / ${all.length} 項目</span></div><div class="progress"><div class="bar" style="width:${all.length?done/all.length*100:0}%"></div></div>${p.groups.map(g=>`<section class="section"><div class="between"><h2>${esc(g.name)}</h2><span class="muted">${g.items.filter(i=>checks[p.id+':'+i.id]).length}/${g.items.length}</span></div><div class="items">${g.items.map(i=>`<div class="item ${i.important?'important':''} ${checks[p.id+':'+i.id]?'done':''}"><label class="check-target"><input type="checkbox" data-check="${esc(i.id)}" ${checks[p.id+':'+i.id]?'checked':''}><span class="name">${esc(i.name)}</span>${i.important?'<span class="tag">★ 最重要</span>':''}</label><button class="edit" data-edit="${esc(i.id)}" aria-label="編集">⋯</button></div>`).join('')||'<div class="item muted">まだ項目がありません</div>'}</div><form class="entry" data-add="${esc(g.id)}"><textarea name="items" placeholder="持ち物を1行ずつ入力してまとめて追加" required></textarea><div class="between"><span class="hint">改行で別アイテム</span><button class="btn primary">＋ まとめて追加</button></div></form></section>`).join('')}<div class="footer"><button class="btn" data-action="group">＋ カテゴリー</button><button class="btn" data-action="reset">チェックをリセット</button><button class="btn" data-action="export">書き出し</button><button class="btn" data-action="import">読み込み</button></div><p class="hint">保存はこの端末のブラウザ内です。ブラウザのデータを削除すると消えるため、定期的な書き出しをおすすめします。</p>`}
$('projects').onclick=e=>{const b=e.target.closest('[data-project]');if(b){selected=b.dataset.project;render()}};$('main').onchange=e=>{if(e.target.matches('[data-check]')){checks[selected+':'+e.target.dataset.check]=e.target.checked;saveChecks()}};$('main').onsubmit=e=>{const f=e.target.closest('[data-add]');if(!f)return;e.preventDefault();mergeBulk(current(),f.elements.items.value,current().groups.find(g=>g.id===f.dataset.add));save()};let editId=null;$('main').onclick=e=>{const row=e.target.closest('.item:has([data-check])');if(row&&!e.target.closest('[data-edit]')&&!e.target.closest('label')&&!e.target.matches('[data-check]')){const cb=row.querySelector('[data-check]');cb.checked=!cb.checked;cb.dispatchEvent(new Event('change',{bubbles:true}));return}const b=e.target.closest('[data-edit]');if(b){editId=b.dataset.edit;const p=current(),g=p.groups.find(g=>g.items.some(i=>i.id===editId)),i=g.items.find(i=>i.id===editId);$('editName').value=i.name;$('editImportant').checked=i.important;$('editGroup').innerHTML=p.groups.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('editGroup').value=g.id;$('editDialog').showModal();return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;const p=current();if(a==='rename'){const n=prompt('案件名',p.name);if(n?.trim()){p.name=n.trim();save()}}if(a==='duplicate'){const copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.name+='（コピー）';copy.groups.forEach(g=>{g.id=uid();g.items.forEach(i=>i.id=uid())});projects.unshift(copy);selected=copy.id;save()}if(a==='delete'&&confirm('案件「'+p.name+'」を削除しますか？')){projects=projects.filter(x=>x.id!==p.id);selected=projects[0]?.id;save()}if(a==='group'){const n=prompt('新しいカテゴリー名');if(n?.trim()){p.groups.push({id:uid(),name:n.trim(),items:[]});save()}}if(a==='reset'&&confirm('この案件のチェックをすべて外しますか？')){p.groups.forEach(g=>g.items.forEach(i=>delete checks[p.id+':'+i.id]));saveChecks()}if(a==='export'){const blob=new Blob([JSON.stringify({version:2,projects},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='SHOW_PACK_backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}if(a==='import')$('importFile').click()};$('new').onclick=()=>{$('projectName').value='';$('initialItems').value='';$('projectDialog').showModal()};$('projectForm').onsubmit=e=>{if(e.submitter?.value!=='save')return;e.preventDefault();const name=$('projectName').value.trim();if(!name)return;const p={id:uid(),name,groups:[]};mergeBulk(p,$('initialItems').value,{name:'持ち物'});if(!p.groups.length)p.groups.push({id:uid(),name:'持ち物',items:[]});projects.unshift(p);selected=p.id;$('projectDialog').close();save()};$('editForm').onsubmit=e=>{if(e.submitter?.value!=='save')return;e.preventDefault();const p=current(),g=p.groups.find(g=>g.items.some(i=>i.id===editId)),i=g.items.find(i=>i.id===editId),target=p.groups.find(g=>g.id===$('editGroup').value);i.name=$('editName').value.trim();if(!i.name)return;i.important=$('editImportant').checked;if(g!==target){g.items=g.items.filter(x=>x.id!==editId);target.items.push(i)}$('editDialog').close();save()};$('removeItem').onclick=()=>{const p=current(),g=p.groups.find(g=>g.items.some(i=>i.id===editId)),i=g.items.find(i=>i.id===editId);if(confirm(`「${i.name}」を削除しますか？`)){g.items=g.items.filter(x=>x.id!==editId);$('editDialog').close();save()}};$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.projects)||!data.projects.every(p=>typeof p.name==='string'&&Array.isArray(p.groups)&&p.groups.every(g=>typeof g.name==='string'&&Array.isArray(g.items)&&g.items.every(i=>typeof i.name==='string'&&typeof i.id==='string'))))throw Error('形式が違います');if(confirm('読み込んだ案件でこの端末のリストを置き換えますか？ チェック状態はリセットされます。')){projects=data.projects;checks={};selected=projects[0]?.id;localStorage.setItem(CHECK,'{}');save()}}catch(err){alert('読み込み失敗: '+err.message)}e.target.value=''};render();
</script></body></html>
